receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}

exporters:
  # Métricas en formato Prometheus; Prometheus las lee de aquí.
  # resource_to_telemetry_conversion agrega la etiqueta service_name (los dashboards separan por servicio).
  prometheus: { endpoint: 0.0.0.0:8889, resource_to_telemetry_conversion: { enabled: true } }
  # Trazas y logs hacia Aspire Dashboard (servicio "aspire-dashboard" del compose).
  otlp/aspire: { endpoint: aspire-dashboard:18889, tls: { insecure: true } }
  debug: { verbosity: basic }

service:
  pipelines:
    traces:  { receivers: [otlp], processors: [batch], exporters: [otlp/aspire, debug] }
    metrics: { receivers: [otlp], processors: [batch], exporters: [prometheus, otlp/aspire] }
