openapi: 3.0.3
info:
  title: Tecflix Users API
  version: 1.0.0
  description: >
    Usuarios, autenticación JWT HS256 y cuota inmutable.
    Convención: el reservationId de un video publicado es igual a su videoId,
    así metadata y streaming pueden liberar la cuota sin guardar otro identificador.
servers:
  - url: http://localhost:8081/api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Quota
  - name: Health
paths:
  /users:
    post:
      tags: [Users]
      security: []
      summary: Registrar usuario
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }
    get:
      tags: [Users]
      summary: Buscar usuarios por username o email
      description: >
        El filtro username es público (solo devuelve id y username).
        El filtro email solo coincide con el email del propio usuario autenticado;
        para el email de otra persona devuelve una lista vacía, para no exponer correos.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/UsernameQuery'
        - $ref: '#/components/parameters/EmailQuery'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de usuarios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Iniciar sesión
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: JWT de duración configurable por JWT_EXPIRATION_SECONDS; no existe refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /users/me:
    get:
      tags: [Users]
      summary: Obtener el usuario autenticado
      operationId: getCurrentUser
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    patch:
      tags: [Users]
      summary: Actualizar email del usuario autenticado
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /users/me/quota:
    get:
      tags: [Quota]
      summary: Consultar cuota propia
      operationId: getMyQuota
      responses:
        '200':
          description: Cuota inmutable y uso actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quota' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Obtener usuario público o propio
      operationId: getUser
      responses:
        '200':
          description: >
            Si {id} es el del usuario autenticado devuelve Me (con email y cuota).
            Si es de otra persona devuelve solo User (id y username).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Me'
                  - $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    patch:
      tags: [Users]
      summary: Actualizar usuario propio; username y cuota no son editables
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
    delete:
      tags: [Users]
      summary: Eliminar usuario propio
      operationId: deleteUser
      responses:
        '204': { description: Usuario eliminado }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /internal/quota/reservations:
    post:
      tags: [Quota]
      security:
        - serviceToken: []
      summary: Crear reserva idempotente de cuota
      description: >
        Idempotente por reservationId: repetir la misma petición devuelve la reserva existente (200).
        Reutilizar un reservationId con datos distintos devuelve 409.
      operationId: reserveQuota
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationRequest' }
      responses:
        '200':
          description: La reserva ya existía con los mismos datos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '201':
          description: Reserva creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/QuotaExceededError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /internal/quota/reservations/{reservationId}/settle:
    post:
      tags: [Quota]
      security:
        - serviceToken: []
      summary: Ajustar una reserva al tamaño final
      description: Solo aplica a reservas activas. Libera la diferencia entre lo reservado y finalBytes.
      operationId: settleQuotaReservation
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [finalBytes]
              properties: { finalBytes: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200':
          description: Reserva ajustada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/QuotaExceededError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /internal/quota/reservations/{reservationId}/release:
    post:
      tags: [Quota]
      security:
        - serviceToken: []
      summary: Liberar reserva
      description: >
        Funciona sobre reservas activas (subida cancelada o fallida) y sobre reservas settled
        (video publicado que se elimina): en ambos casos devuelve los bytes a la cuota del usuario.
        Es idempotente: liberar una reserva ya liberada devuelve 204.
      operationId: releaseQuotaReservation
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '204': { description: Reserva liberada }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /health:
    get:
      tags: [Health]
      security: []
      summary: Comprobar que el servicio está vivo
      operationId: getHealth
      responses:
        '200': { $ref: '#/components/responses/HealthResponse' }
  /ready:
    get:
      tags: [Health]
      security: []
      summary: Comprobar que el servicio está listo (archivo de usuarios, disco)
      operationId: getReady
      responses:
        '200': { $ref: '#/components/responses/HealthResponse' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT HS256 de usuario; duración configurable; sin refresh.
        Claims: sub (id del usuario, UUID), username, iat y exp.
    serviceToken:
      type: http
      scheme: bearer
      description: Token interno entre servicios, distinto del JWT de usuario.
  parameters:
    UserId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ReservationId: { name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }
    UsernameQuery: { name: username, in: query, schema: { type: string } }
    EmailQuery: { name: email, in: query, schema: { type: string, format: email } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
  schemas:
    CreateUserRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9_.-]+$' }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, format: password }
    LoginRequest:
      type: object
      required: [username, password]
      properties: { username: { type: string }, password: { type: string, format: password } }
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties: { email: { type: string, format: email } }
      additionalProperties: false
    User:
      type: object
      required: [id, username]
      properties: { id: { type: string, format: uuid }, username: { type: string } }
    Me:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [email, quotaBytes, usedBytes]
          properties:
            email: { type: string, format: email }
            quotaBytes: { type: integer, format: int64, readOnly: true }
            usedBytes: { type: integer, format: int64, readOnly: true }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, format: int64, description: Segundos configurados para la expiración del JWT }
        user: { $ref: '#/components/schemas/Me' }
    Quota:
      type: object
      required: [quotaBytes, usedBytes, remainingBytes]
      properties:
        quotaBytes: { type: integer, format: int64, readOnly: true }
        usedBytes: { type: integer, format: int64, readOnly: true }
        remainingBytes: { type: integer, format: int64, readOnly: true }
    UserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        nextCursor: { type: string, nullable: true }
    ReservationRequest:
      type: object
      required: [reservationId, userId, bytes]
      properties:
        reservationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        bytes: { type: integer, format: int64, minimum: 0 }
        expiresAt: { type: string, format: date-time }
    Reservation:
      allOf:
        - $ref: '#/components/schemas/ReservationRequest'
        - type: object
          required: [status, createdAt]
          properties:
            status: { type: string, enum: [active, settled, released, expired] }
            createdAt: { type: string, format: date-time }
    ApiError:
      type: object
      required: [code, message, details, traceId]
      properties:
        code: { type: string }
        message: { type: string }
        details: { nullable: true }
        traceId: { type: string }
  responses:
    ValidationError: { description: Error de validación, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    UnauthorizedError: { description: Token ausente, inválido o expirado (JWT de usuario o token de servicio según el endpoint), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    ForbiddenError: { description: Operación no permitida, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    QuotaExceededError: { description: Cuota insuficiente (código QUOTA_EXCEEDED), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    ConflictError: { description: Conflicto (USERNAME_EXISTS, EMAIL_EXISTS, INVALID_STATE o reservationId reutilizado), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    NotFoundError: { description: No encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    ServiceUnavailableError: { description: Servicio no listo, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    HealthResponse: { description: Estado del servicio, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ok, ready] } } } } } }
