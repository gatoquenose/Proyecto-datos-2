openapi: 3.0.3
info:
  title: Tecflix Metadata API
  version: 1.0.0
  description: >
    Metadata de videos, visibilidad y listado cursor-based en MongoDB.
    Convención: el reservationId de cuota de un video es igual a su videoId.
    Eliminación: primero lógica (campo interno deletedAt, el video deja de aparecer en
    consultas y listados), luego física cuando streaming confirma el borrado de archivos.
servers:
  - url: http://localhost:8082/api/v1
security:
  - bearerAuth: []
tags:
  - name: Videos
  - name: Internal
  - name: Health
paths:
  /videos:
    post:
      tags: [Videos]
      summary: Crear metadata de video
      operationId: createVideo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVideoRequest' }
      responses:
        '201':
          description: Video creado en estado processing
          content: { application/json: { schema: { $ref: '#/components/schemas/Video' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    get:
      tags: [Videos]
      summary: Listar videos públicos y propios con orden y cursor en MongoDB
      description: >
        Devuelve los videos del usuario autenticado más los públicos de otros usuarios.
        El orden por author usa ownerUsername. Un cursor mal formado devuelve 400 INVALID_CURSOR.
      operationId: listVideos
      parameters:
        - { $ref: '#/components/parameters/SortBy' }
        - { $ref: '#/components/parameters/Order' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Search' }
        - name: owner
          in: query
          description: Con valor me devuelve solamente videos del usuario autenticado
          schema: { type: string, enum: [me] }
      responses:
        '200':
          description: Página ordenada; nextCursor es opaco y null en la última página
          content: { application/json: { schema: { $ref: '#/components/schemas/VideoPage' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /videos/{id}:
    parameters: [{ $ref: '#/components/parameters/VideoId' }]
    get:
      tags: [Videos]
      summary: Consultar video
      description: Un video privado solo lo puede consultar su dueño; para otros usuarios devuelve 403.
      operationId: getVideo
      responses:
        '200': { description: Video, content: { application/json: { schema: { $ref: '#/components/schemas/Video' } } } }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    patch:
      tags: [Videos]
      summary: Actualizar metadata editable del dueño
      operationId: updateVideo
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateVideoRequest' } } }
      responses:
        '200': { description: Video actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Video' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Videos]
      summary: Eliminar video del dueño y coordinar borrado físico
      description: >
        Flujo: (1) marca el video como eliminado (deletedAt); (2) pide a streaming borrar los archivos
        (DELETE /internal/videos/{videoId} en streaming); si streaming no responde, revierte la marca y
        devuelve 502; (3) responde 204. Cuando streaming termina el borrado físico llama a
        streaming-deleted y entonces metadata elimina el documento y libera la cuota
        (release del reservationId = id en la API de usuarios).
        Si el video tiene una subida activa devuelve 409 INVALID_STATE; el dueño debe cancelar la subida primero.
      operationId: deleteVideo
      responses:
        '204': { description: Eliminación aceptada }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '502': { $ref: '#/components/responses/DependencyError' }
  /videos/{id}/visibility:
    parameters: [{ $ref: '#/components/parameters/VideoId' }]
    patch:
      tags: [Videos]
      summary: Cambiar visibilidad del dueño
      operationId: updateVideoVisibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties: { visibility: { $ref: '#/components/schemas/Visibility' } }
      responses:
        '200': { description: Video actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Video' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /internal/videos/{id}/processing-complete:
    parameters: [{ $ref: '#/components/parameters/VideoId' }]
    post:
      tags: [Internal]
      security:
        - serviceToken: []
      summary: Notificar procesamiento exitoso
      description: Pasa el video a ready y guarda la duración. Idempotente si ya estaba ready con los mismos datos.
      operationId: markProcessingComplete
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProcessingCompleteRequest' } } }
      responses:
        '204': { description: Estado actualizado }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /internal/videos/{id}/processing-failed:
    parameters: [{ $ref: '#/components/parameters/VideoId' }]
    post:
      tags: [Internal]
      security:
        - serviceToken: []
      summary: Notificar fallo de procesamiento
      operationId: markProcessingFailed
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProcessingFailedRequest' } } }
      responses:
        '204': { description: Estado actualizado }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /internal/videos/{id}/streaming-deleted:
    parameters: [{ $ref: '#/components/parameters/VideoId' }]
    post:
      tags: [Internal]
      security:
        - serviceToken: []
      summary: Confirmar borrado físico en streaming
      description: Elimina el documento del video y libera la cuota del dueño. Idempotente.
      operationId: confirmStreamingDeleted
      responses:
        '204': { description: Confirmación recibida }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '502': { $ref: '#/components/responses/DependencyError' }
  /health:
    get:
      tags: [Health]
      security: []
      summary: Comprobar que el servicio está vivo
      operationId: getHealth
      responses:
        '200': { $ref: '#/components/responses/HealthResponse' }
  /ready:
    get:
      tags: [Health]
      security: []
      summary: Comprobar que el servicio está listo (MongoDB)
      operationId: getReady
      responses:
        '200': { $ref: '#/components/responses/HealthResponse' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT HS256 emitido por la API de usuarios; duración configurable; sin refresh.
        Claims: sub (id del usuario, UUID), username, iat y exp.
    serviceToken:
      type: http
      scheme: bearer
      description: Token interno entre servicios, distinto del JWT de usuario.
  parameters:
    VideoId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    SortBy: { name: sortBy, in: query, schema: { type: string, enum: [title, author, uploadedAt], default: uploadedAt } }
    Order: { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
    Search: { name: q, in: query, schema: { type: string, maxLength: 200 } }
  schemas:
    Visibility: { type: string, enum: [public, private] }
    VideoStatus: { type: string, enum: [processing, ready, failed] }
    CreateVideoRequest:
      type: object
      required: [title, description, author, topic, tags, visibility, sizeBytes]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        author: { type: string, maxLength: 200 }
        topic: { type: string, maxLength: 100 }
        tags: { type: array, maxItems: 30, items: { type: string, maxLength: 50 } }
        uploadedAt: { type: string, format: date-time }
        visibility: { $ref: '#/components/schemas/Visibility' }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
    UpdateVideoRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        author: { type: string, maxLength: 200 }
        topic: { type: string, maxLength: 100 }
        tags: { type: array, maxItems: 30, items: { type: string, maxLength: 50 } }
        uploadedAt: { type: string, format: date-time }
    Video:
      type: object
      required: [id, ownerId, ownerUsername, title, description, author, topic, tags, durationSeconds, uploadedAt, visibility, sizeBytes, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        ownerId: { type: string, format: uuid, readOnly: true }
        ownerUsername: { type: string, readOnly: true }
        title: { type: string }
        description: { type: string }
        author: { type: string }
        topic: { type: string }
        tags: { type: array, items: { type: string } }
        durationSeconds: { type: integer, minimum: 0, readOnly: true }
        uploadedAt: { type: string, format: date-time }
        visibility: { $ref: '#/components/schemas/Visibility' }
        sizeBytes: { type: integer, format: int64, readOnly: true }
        status: { $ref: '#/components/schemas/VideoStatus' }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    VideoPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Video' } }
        nextCursor: { type: string, nullable: true }
    ProcessingCompleteRequest:
      type: object
      required: [durationSeconds]
      properties: { durationSeconds: { type: integer, minimum: 0 }, finalSizeBytes: { type: integer, format: int64, minimum: 0 } }
    ProcessingFailedRequest:
      type: object
      required: [reason]
      properties: { reason: { type: string, maxLength: 1000 } }
    ApiError:
      type: object
      required: [code, message, details, traceId]
      properties: { code: { type: string }, message: { type: string }, details: { nullable: true }, traceId: { type: string } }
  responses:
    ValidationError: { description: Validación fallida (VALIDATION_ERROR o INVALID_CURSOR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    UnauthorizedError: { description: Token ausente, inválido o expirado (JWT de usuario o token de servicio según el endpoint), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    ForbiddenError: { description: Sin permisos, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    NotFoundError: { description: No encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    ConflictError: { description: Estado conflictivo (INVALID_STATE), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    DependencyError: { description: Otro servicio no respondió (DEPENDENCY_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    ServiceUnavailableError: { description: Servicio no listo, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    HealthResponse: { description: Estado del servicio, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ok, ready] } } } } } }
