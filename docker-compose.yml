services:
  users-api:
    build: { context: ., target: users-api }
    env_file: .env
    environment:
      USERS_DATA_DIR: /data/users
    volumes: ["users-data:/data/users"]
    ports: ["8081:8081"]

  metadata-api:
    build: { context: ., target: metadata-api }
    env_file: .env
    environment:
      USERS_API_HOST: users-api
      STREAMING_API_HOST: streaming-api
    restart: on-failure
    depends_on: [users-api, mongo]
    ports: ["8082:8082"]

  mongo:
    image: mongo:7
    volumes: ["mongo-data:/data/db"]

  streaming-api:
    build: { context: ., target: streaming-api }
    env_file: .env
    environment:
      USERS_API_HOST: users-api
      METADATA_API_HOST: metadata-api
      METADATA_API_PORT: "8082"
      STREAMING_BIND_HOST: 0.0.0.0
      STREAMING_DATA_DIR: /data/streaming
      FRONTEND_ORIGIN: http://localhost:5173
    volumes: ["streaming-data:/data/streaming"]
    depends_on: [users-api, metadata-api]
    ports: ["8083:8083"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    depends_on: [aspire-dashboard]

  # Trazas y logs (OTLP gRPC en 18889, que es adonde exporta el collector). Interfaz en http://localhost:18888
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports: ["18888:18888"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    volumes: ["./observability/grafana:/etc/grafana/provisioning:ro"]

volumes:
  mongo-data:
  users-data:
  streaming-data: